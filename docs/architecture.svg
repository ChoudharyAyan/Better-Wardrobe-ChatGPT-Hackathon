<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" role="img" aria-label="WardrobeOS system design: UI, frontend, backend and external services feed a central LLM reasoning engine, backed by data stores, with a feedback loop returning user actions as context."><style>
svg{
  --bg:#f8f4f2; --surface:#ffffff; --fg:#2b2326; --muted:#76696d; --line:#ddd2ce;
  --rose:#b94b66; --rose-soft:#f7e4e9; --rose-line:#e6b7c3; --sage:#4f7a68; --sage-soft:#e6efea;
  
 font-family:Montserrat,"Helvetica Neue",Arial,sans-serif}
@media (prefers-color-scheme:dark){svg{
  --bg:#1a1517; --surface:#241e21; --fg:#f2ebed; --muted:#a8999e; --line:#3d3337;
  --rose:#e57e98; --rose-soft:#36212a; --rose-line:#6b3646; --sage:#86b7a1; --sage-soft:#1f2c27; }}
.bg{fill:var(--surface)}
.box{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.inner{fill:var(--surface);stroke:var(--rose-line);stroke-width:1.2}
