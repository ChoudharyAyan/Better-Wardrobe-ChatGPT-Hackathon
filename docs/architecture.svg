.fb{fill:var(--sage-soft);stroke:var(--sage);stroke-width:1.6}
.fstep{fill:var(--surface);stroke:var(--sage);stroke-width:1.2}
.chip{fill:var(--bg);stroke:var(--line)}
.chipd{fill:none;stroke:var(--muted)}
.mchip{fill:var(--rose-soft);stroke:none}
.num{fill:var(--rose)}
text{fill:var(--fg)}
.h1{font-size:19px;font-weight:700;fill:var(--rose)}
.h1f{font-size:17px;font-weight:700;fill:var(--sage)}
.h2{font-size:15px;font-weight:700}
.h2b{font-size:14px;font-weight:700}
.h3{font-size:13.5px;font-weight:700}
.sub{font-size:12px;fill:var(--muted)}
.tx{font-size:12.5px}
.txs{font-size:12px}
.lab{font-size:11.5px;fill:var(--muted);font-weight:500}
.eyebrow{font-size:12px;font-weight:700;fill:var(--muted);letter-spacing:.04em}
.chipt{font-size:11.5px;fill:var(--fg)}
.mchipt{font-size:10.5px;font-weight:600;fill:var(--rose)}
.numt{font-size:12px;font-weight:700;fill:var(--surface)}
.ar{fill:none;stroke:var(--muted);stroke-width:1.6}
.ar2{fill:none;stroke:var(--rose);stroke-width:1.8}
.ar3{fill:none;stroke:var(--sage);stroke-width:1.8}
.mk{fill:var(--muted)} .mk2{fill:var(--rose)} .mk3{fill:var(--sage)}

